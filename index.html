<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta
      name="description"
      content="FunCode KOBEの授業を、もくもくタイム・休憩・なるほどタイムに沿って進行するタイマーです。"
    />
    <title>FunCode KOBE｜授業タイマー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="FunCode KOBE 授業タイマー">
          <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
          <span class="brand-name">FunCode <span>KOBE</span></span>
        </a>
        <div class="topbar-actions">
          <button class="topbar-button" id="mute-button" type="button" aria-label="サウンドを消音" aria-pressed="false">
            <span aria-hidden="true">🔊</span>
          </button>
          <button class="topbar-button" id="fullscreen-button" type="button" aria-label="画面を最大化" aria-pressed="false">
            <span aria-hidden="true">⛶</span>
          </button>
          <span class="topbar-label">LESSON TIMER</span>
        </div>
      </header>

      <section class="timer-card" aria-labelledby="page-title">
        <div class="card-heading">
          <div>
            <p class="eyebrow">TODAY'S CLASS</p>
            <h1 id="page-title">授業の時間</h1>
          </div>
          <label class="duration-picker" for="duration">
            <span>授業時間</span>
            <span class="select-wrap">
              <select id="duration" aria-label="授業時間">
                <option value="75">75分</option>
                <option value="90" selected>90分</option>
                <option value="100">100分</option>
                <option value="120">120分</option>
                <option value="150">150分</option>
                <option value="custom">その他</option>
              </select>
              <span class="select-chevron" aria-hidden="true">⌄</span>
            </span>
          </label>
        </div>

        <div class="timer-display" aria-live="polite">
          <span class="phase-marker" aria-hidden="true"></span>
          <p class="phase-name" id="phase-name">もくもくタイム</p>
          <p class="countdown" id="countdown" role="timer">30:00</p>
          <div class="time-adjustments" aria-label="残り時間の調整">
            <button class="time-adjust-button" type="button" data-adjust-seconds="-60" aria-label="残り時間を1分減らす">−1:00</button>
            <button class="time-adjust-button" type="button" data-adjust-seconds="-30" aria-label="残り時間を30秒減らす">−0:30</button>
            <button class="time-adjust-button" type="button" data-adjust-seconds="30" aria-label="残り時間を30秒増やす">＋0:30</button>
            <button class="time-adjust-button" type="button" data-adjust-seconds="60" aria-label="残り時間を1分増やす">＋1:00</button>
          </div>
          <p class="phase-caption" id="phase-caption">自分のペースで、集中しよう。</p>
        </div>

        <div class="progress-section">
          <div class="progress-meta">
            <span>授業の進み具合</span>
            <span id="progress-label">0<span class="progress-divider"> / </span>90分</span>
          </div>
          <div
            class="progress-track"
            id="progress-track"
            role="progressbar"
            aria-label="授業の進み具合"
            aria-valuemin="0"
            aria-valuemax="90"
            aria-valuenow="0"
          >
            <span class="progress-fill" id="progress-fill"></span>
          </div>
        </div>

        <div class="controls">
          <button class="button button-primary" id="start-button" type="button">
            <span class="button-icon" aria-hidden="true">▶</span>
            <span>スタート</span>
          </button>
          <button class="button button-secondary" id="reset-button" type="button">
            <span class="button-icon reset-icon" aria-hidden="true">↻</span>
            <span>リセット</span>
          </button>
        </div>

        <p class="status-message" id="status-message" aria-live="polite">準備ができたらスタート</p>
      </section>

      <section class="schedule" aria-labelledby="schedule-title">
        <div class="schedule-heading">
          <div>
            <p class="eyebrow">LESSON FLOW</p>
            <h2 id="schedule-title">今日のながれ</h2>
          </div>
          <span class="schedule-total" id="schedule-total">全 90 分</span>
        </div>
        <nav class="phase-navigation" aria-label="タイムの移動">
          <button class="phase-nav-button" id="previous-phase" type="button">← 前のタイム</button>
          <span class="phase-position" id="phase-position" aria-live="polite">1 / 5</span>
          <button class="phase-nav-button" id="next-phase" type="button">次のタイム →</button>
        </nav>
        <ol class="schedule-list" id="schedule-list">
          <li class="schedule-item is-active" data-phase="0">
            <button class="schedule-item-button" type="button" aria-current="step">
              <span class="schedule-number">01</span>
              <span class="schedule-name">もくもくタイム</span>
              <span class="schedule-duration">30分</span>
            </button>
          </li>
          <li class="schedule-item" data-phase="1">
            <button class="schedule-item-button" type="button">
              <span class="schedule-number">02</span>
              <span class="schedule-name">休憩</span>
              <span class="schedule-duration">5分</span>
            </button>
          </li>
          <li class="schedule-item" data-phase="2">
            <button class="schedule-item-button" type="button">
              <span class="schedule-number">03</span>
              <span class="schedule-name">なるほどタイム</span>
              <span class="schedule-duration">20分</span>
            </button>
          </li>
          <li class="schedule-item" data-phase="3">
            <button class="schedule-item-button" type="button">
              <span class="schedule-number">04</span>
              <span class="schedule-name">休憩</span>
              <span class="schedule-duration">5分</span>
            </button>
          </li>
          <li class="schedule-item" data-phase="4">
            <button class="schedule-item-button" type="button">
              <span class="schedule-number">05</span>
              <span class="schedule-name">もくもくタイム</span>
              <span class="schedule-duration">30分</span>
            </button>
          </li>
        </ol>
      </section>

      <footer class="footer">
        <span>ひとつずつ、できた！を増やそう。</span>
        <span>FunCode KOBE</span>
      </footer>
    </main>
    <dialog class="duration-dialog" id="duration-dialog" aria-labelledby="dialog-title">
      <form method="dialog" id="duration-form">
        <p class="eyebrow">LESSON LENGTH</p>
        <h2 id="dialog-title">授業時間を設定</h2>
        <label for="custom-duration">授業時間（分）</label>
        <input id="custom-duration" type="number" min="61" max="240" value="90" required />
        <p class="input-hint">61〜240分で設定できます</p>
        <div class="dialog-actions">
          <button class="button button-secondary" value="cancel">キャンセル</button>
          <button class="button button-primary" id="apply-duration" value="apply">設定する</button>
        </div>
      </form>
    </dialog>
    <script src="app.js" defer></script>
  </body>
</html>
